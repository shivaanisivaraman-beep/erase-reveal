<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erase to Reveal</title>
<style>
  :root{--bg:#f6f4ef;--card:#ffffff;--text:#1c1c1e;--muted:#6a6a70;--accent:#2a9d8f;--accent-text:#fff;--shadow:rgba(0,0,0,.15)}
  @media (prefers-color-scheme: dark){
    :root{--bg:#17181b;--card:#25272c;--text:#f2f2f4;--muted:#a3a3ab;--accent:#4cc3b4;--accent-text:#10211f;--shadow:rgba(0,0,0,.5)}
  }
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif}
  body{display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  h1{font-size:1.4rem;margin:0 0 4px;text-align:center}
  .hint{color:var(--muted);font-family:system-ui,sans-serif;font-size:.95rem;margin:0 0 18px;text-align:center}
  .stage{position:relative;width:min(340px,100%);aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 10px 28px var(--shadow)}
  .under{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .over{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .6s}
  .over.done{opacity:0;pointer-events:none}
  .name{font-size:1.25rem;font-weight:bold;margin:14px 0 0;text-align:center}
  .role{font-family:system-ui,sans-serif;color:var(--muted);font-size:.9rem;margin:2px 0 0;text-align:center}
  button{margin-top:16px;font-family:system-ui,sans-serif;font-size:.95rem;background:var(--accent);color:var(--accent-text);border:0;border-radius:999px;padding:10px 20px;cursor:pointer}
</style>
</head>
<body>
<h1>Who’s Behind the Picture?</h1>
<p class="hint" id="hint">Rub the picture with your finger or mouse to erase it.</p>

<div class="stage" id="stage">
  <img class="under" id="under" alt="">
  <canvas class="over" id="over"></canvas>
</div>

<p class="name" id="name"></p>
<p class="role" id="role"></p>
<button id="reset" type="button">Start over ↻</button>

<script>
// ===== EDIT THESE =====
var PERSON_1 = {img: "person1.jpg", name: "Person One", role: "Add a title or quote here"};
var PERSON_2 = {img: "person2.jpg", name: "Person Two", role: "Add a title or quote here"};
// Put person1.jpg and person2.jpg in the same folder as this file.
// ======================

var stage = document.getElementById('stage'),
    under = document.getElementById('under'),
    canvas = document.getElementById('over'),
    ctx = canvas.getContext('2d'),
    hint = document.getElementById('hint'),
    nameEl = document.getElementById('name'),
    roleEl = document.getElementById('role');

var topImg = new Image();
var w = 0, h = 0, drawing = false, last = null, revealed = false;
var N = 24, hit = [], hitCount = 0;   // coarse grid that tracks how much was erased

under.src = PERSON_2.img;
under.alt = PERSON_2.name;
topImg.src = PERSON_1.img;

function caption(p){ nameEl.textContent = p.name; roleEl.textContent = p.role; }

// draw an image "contained" inside the stage, same as object-fit: contain
function drawContain(im){
  var s = Math.min(w / im.naturalWidth, h / im.naturalHeight);
  var iw = im.naturalWidth * s, ih = im.naturalHeight * s;
  ctx.drawImage(im, (w - iw) / 2, (h - ih) / 2, iw, ih);
}

function paint(){
  var r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  w = r.width; h = r.height;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  drawContain(topImg);
  hit = []; hitCount = 0;
}

function pos(e){ var r = canvas.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }

function erase(a, b){
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(28, w * 0.1);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  mark(b.x, b.y);
}

function mark(x, y){
  var rad = Math.max(28, w * 0.1) / 2;
  for (var gx = Math.floor((x - rad) / w * N); gx <= Math.floor((x + rad) / w * N); gx++){
    for (var gy = Math.floor((y - rad) / h * N); gy <= Math.floor((y + rad) / h * N); gy++){
      if (gx < 0 || gy < 0 || gx >= N || gy >= N) continue;
      var k = gy * N + gx;
      if (!hit[k]){ hit[k] = 1; hitCount++; }
    }
  }
}

function finish(){
  revealed = true;
  canvas.classList.add('done');
  caption(PERSON_2);
  hint.textContent = 'Surprise! Meet the person underneath.';
}

function check(){ if (!revealed && hitCount / (N * N) > 0.5) finish(); }

canvas.addEventListener('pointerdown', function(e){
  drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); erase(last, last);
});
canvas.addEventListener('pointermove', function(e){
  if (!drawing) return;
  var p = pos(e); erase(last, p); last = p; check();
});
['pointerup', 'pointercancel'].forEach(function(ev){
  canvas.addEventListener(ev, function(){ drawing = false; check(); });
});

document.getElementById('reset').addEventListener('click', function(){
  revealed = false;
  canvas.classList.remove('done');
  caption(PERSON_1);
  hint.textContent = 'Rub the picture with your finger or mouse to erase it.';
  paint();
});

window.addEventListener('resize', function(){ if (!revealed) paint(); });
topImg.onload = function(){ caption(PERSON_1); paint(); };
</script>
</body>
</html>
